- name: Configure 10Gb Ceph network interface
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} ANSIBLE MANAGED - 10Gb Ceph network"
    block: |
      auto enp8s0
      iface enp8s0 inet static
          address {{ ceph_ip }}/24
          gateway 10.10.10.1
          mtu 9000
  notify: Restart networking

- name: Install lm-sensors
  ansible.builtin.apt:
    name: lm-sensors
    state: present

- name: Detect hardware sensors
  ansible.builtin.command: sensors-detect --auto
  changed_when: false

- name: Load drivetemp kernel module
  community.general.modprobe:
    name: drivetemp
    state: present

- name: Persist drivetemp kernel module across reboots
  ansible.builtin.copy:
    content: "drivetemp\n"
    dest: /etc/modules-load.d/drivetemp.conf
    owner: root
    group: root
    mode: "0644"

- name: Load hp-wmi-sensors kernel module
  community.general.modprobe:
    name: hp-wmi-sensors
    state: present

- name: Persist hp-wmi-sensors kernel module across reboots
  ansible.builtin.copy:
    content: "hp-wmi-sensors\n"
    dest: /etc/modules-load.d/hp-wmi-sensors.conf
    owner: root
    group: root
    mode: "0644"
