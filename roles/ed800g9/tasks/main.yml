- name: Configure 10Gb Ceph network interface
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} ANSIBLE MANAGED - 10Gb Ceph network"
    block: |
      auto enp8s0
      iface enp8s0 inet static
          address {{ ceph_ip }}/24
          mtu 9000
  notify: Restart networking

- name: Install lm-sensors
  ansible.builtin.apt:
    name: lm-sensors
    state: present

- name: Detect hardware sensors
  ansible.builtin.command: sensors-detect --auto
  changed_when: false

- name: Load drivetemp kernel module
  community.general.modprobe:
    name: drivetemp
    state: present

- name: Persist drivetemp kernel module across reboots
  ansible.builtin.copy:
    content: "drivetemp\n"
    dest: /etc/modules-load.d/drivetemp.conf
    owner: root
    group: root
    mode: "0644"

- name: Load hp-wmi-sensors kernel module
  community.general.modprobe:
    name: hp-wmi-sensors
    state: present

- name: Persist hp-wmi-sensors kernel module across reboots
  ansible.builtin.copy:
    content: "hp-wmi-sensors\n"
    dest: /etc/modules-load.d/hp-wmi-sensors.conf
    owner: root
    group: root
    mode: "0644"

# The atlantic Thunderbolt->SFP+ 10G NIC throws fatal, unrecoverable PCIe AERs
# that drop the node off the Ceph net. Forcing the ASPM policy to "performance"
# (L0 only, no L0s/L1) cut the rate roughly 9x per node-day, but did NOT
# eliminate it — pve06 failed again on 2026-08-18 with this in effect (PD #29,
# OFF-633). Keep it; see the runtime-PM task below for the follow-on fix.
#
# NB: the original "fails under sustained load" reading is FALSIFIED. At the
# instant of the pve06 AER the link was carrying 0.22 MB/s (idle); the window
# peaked at 29 MB/s, ~2% of 10 Gb. Do not re-derive a load hypothesis from the
# qm-clone correlation seen on 2026-08-13 — that was coincidence.
#
# Persisted via tmpfiles (a /sys write at boot) rather than a kernel cmdline
# arg, to avoid disturbing the custom Secure Boot chain. Runtime effect requires
# no reboot.
- name: Persist PCIe ASPM policy = performance (Thunderbolt NIC AER fix)
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/pcie-aspm.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (ed800g9 role) — do not edit.
      w /sys/module/pcie_aspm/parameters/policy - - - - performance
  notify: Apply pcie-aspm tmpfiles
  # Tagged so the NIC-AER fix applies alongside the base redirect hardening in a
  # single scoped run (`--tags hardening`), without a full site.yml pass that
  # would also fire the cluster/ceph/network plays.
  tags:
    - hardening

# Follow-on to the ASPM fix above. ASPM governs L0s/L1 *link* states; it does
# nothing about D-state *runtime suspend*, which is what the failure signature
# actually points at: on a healthy node the thunderbolt controller sits at
# `control=auto status=suspended` while the NIC below it is active, and the
# pve06 AER wedged on exactly those devices with
# "Unable to change power state from D0 to D3hot, device inaccessible".
# Failures occur at idle, which is precisely when runtime PM suspends things.
#
# Matched by DRIVER rather than PCI address on purpose: the thunderbolt
# controller is NOT in the NIC's parent-bridge chain (it hangs off a sibling
# branch), and addresses can shift when the bus re-enumerates after an AER, so
# a hardcoded BDF list would silently miss the device that matters.
#
# ACTION=="add|bind": on a bare "add" the driver is not yet bound, so DRIVER==
# would not match — "bind" is what fires once binding completes.
#
# Trade-off: this disables PCIe runtime power management for every pcieport
# bridge on the box, not just the Thunderbolt chain. On always-on cluster nodes
# the idle-power cost is negligible against four fatal AERs in a week.
#
# ⚠️ HYPOTHESIS, not a proven fix. Validate by watching whether pve06 survives
# past the ~7-day interval at which it failed with only ASPM applied.
- name: Disable PCIe runtime power management on the Thunderbolt/NIC chain
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/80-pcie-runtime-pm.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (ed800g9 role) — do not edit.
      ACTION=="add|bind", SUBSYSTEM=="pci", DRIVER=="thunderbolt", ATTR{power/control}="on"
      ACTION=="add|bind", SUBSYSTEM=="pci", DRIVER=="pcieport", ATTR{power/control}="on"
      ACTION=="add|bind", SUBSYSTEM=="pci", DRIVER=="atlantic", ATTR{power/control}="on"
  notify: Apply pcie runtime-pm rule
  tags:
    - hardening

# Third attempt at the Thunderbolt NIC AER, after ASPM and PCIe runtime PM both
# FAILED. Do not read this as "another power tweak" — it targets a different
# layer than either of those, which is precisely why they could not have worked.
#
# What the failure actually is (pve06, 2026-08-20 09:30:30 EDT):
#   pcieport 0000:03:00.0: AER: PCIe Bus Error: severity=Uncorrectable (Fatal),
#                               type=Inaccessible
#   thunderbolt/atlantic/xhci_hcd: AER: can't recover (no error_detected callback)
#   pcieport 0000:00:1d.0: AER: device recovery failed
# `type=Inaccessible` is a LINK DROP / surprise-removal, not data corruption —
# no Malformed TLP, no Completion Timeout. The device simply stops answering,
# and because those three drivers implement no error_detected callback the
# kernel cannot re-establish it: dead until reboot.
#
# It is fleet-wide, not one bad node: pve05 2 fatals (Aug 11, Aug 13),
# pve06 2 (Aug 18, Aug 20), pve07 1 (Aug 13) — same device, same signature,
# identical kernel / TB NVM 39.83 / atlantic fw 3.1.121 / BIOS U21 02.21.00.
#
# Why C-states: the failure correlates with IDLE (link throughput at the PD #29
# fatal was 0.22 MB/s), and pve06 logged C10 usage=714927 in under an hour of
# uptime. C10 power-gates SoC logic including the PCIe/Thunderbolt path. ASPM
# governs link states and runtime PM governs device D-states; NEITHER affects
# package idle states, so both were addressing the wrong layer.
#
# Persisted as a boot-time /sys write, NOT a kernel cmdline arg
# (intel_idle.max_cstate=), for the same Secure Boot reason as the ASPM fix
# above. Runtime effect requires no reboot.
#
# Trade-off: costs roughly 10-20 W idle per node and some heat. Deliberate —
# these are always-on cluster nodes whose storage network keeps dropping.
#
# ⚠️ HYPOTHESIS, not a proven fix — the third one. Success criterion is NO fatal
# AER on any node for 14 consecutive days. If one recurs with C8/C10 disabled,
# record it on OFF-633 and mark this falsified; do not quietly try a fourth
# variant of the same idea. See OFF-735.
- name: Deploy deep C-state limiter (Thunderbolt NIC AER mitigation)
  ansible.builtin.copy:
    src: limit-deep-cstates.sh
    dest: /usr/local/sbin/limit-deep-cstates.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - hardening

- name: Deploy deep C-state limiter unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/limit-deep-cstates.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (ed800g9 role) — do not edit.
      [Unit]
      Description=Limit deep CPU package C-states (Thunderbolt NIC AER mitigation)
      ConditionPathExists=/sys/devices/system/cpu/cpu0/cpuidle

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/limit-deep-cstates.sh C8 C10

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd for cstate limiter
  tags:
    - hardening

- name: Flush handlers so the unit is loaded before it is enabled
  ansible.builtin.meta: flush_handlers

# Skipped under --check: check mode never writes the unit file above, so systemd
# would fail with "Could not find the requested service" and mask any real
# finding in the dry run.
- name: Enable and start the deep C-state limiter
  ansible.builtin.systemd:
    name: limit-deep-cstates.service
    enabled: true
    state: started
  when: not ansible_check_mode
  tags:
    - hardening
