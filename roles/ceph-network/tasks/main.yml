- name: Configure 10Gb Ceph interface
  ansible.builtin.template:
    src: ceph-10g.cfg.j2
    dest: /etc/network/interfaces.d/ceph-10g.cfg
    owner: root
    group: root
    mode: "0644"
  when: ceph_network_interface is defined
  notify: Restart networking

# The Ceph cluster net is a directly-attached, L2-isolated /24 — the ed800g9
# role puts enp8s0 on it at MTU 9000, so every node reaches 10.10.10.0/24 over
# its connected route, never through the switch. The old design instead dropped
# a host route via the CRS305's L3 address (an if-up hook re-adding it every
# boot). That route competed with the connected route at equal metric: whenever
# it won, jumbo Ceph traffic blackholed over the 1500-MTU management bridge. The
# switch is L2-only now, so the route is pure poison — remove the hook and purge
# any copy it already installed. Idempotent: a no-op on nodes that never had it.
- name: Remove the obsolete Ceph L3 route hook (legacy bleed design)
  ansible.builtin.file:
    path: /etc/network/if-up.d/ceph-route
    state: absent

- name: Purge any lingering host route to the Ceph net via the switch
  ansible.builtin.command:
    cmd: "ip route del {{ ceph_network_subnet }} via {{ ceph_route_via }}"
  register: ceph_route_del
  changed_when: ceph_route_del.rc == 0
  failed_when:
    - ceph_route_del.rc != 0
    - "'No such process' not in ceph_route_del.stderr"
    - "'No such file' not in ceph_route_del.stderr"
