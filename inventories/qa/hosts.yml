# QA verification workstation (OFF-856) — officina-qa-runner-1 (vmid 8006).
#
# A guest VM, kept OUT of the homelab inventory (inventories/homelab/) on purpose
# so it never receives the pve `base` / `proxmox` / `alloy` plays — same posture
# the github-runner-vm role documents for the CI runner guests.
#
# Reached over the tailnet, not the LAN: run qa-runner.yml from a tailnet host
# (blacksun) whose identity has tailscale-ssh root to tag:officina-ci
# (noah@ -> tag:officina-ci : root in the officina ACL). No SSH key needed —
# Tailscale SSH authenticates the connection.
qa_runners:
  hosts:
    officina-qa-runner-1:
      ansible_host: officina-qa-runner-1
      ansible_user: root
      ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
