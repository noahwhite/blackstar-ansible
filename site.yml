    - routeros-crs305

- name: Ceph network configuration
  hosts: proxmox
  tags: network
  roles:
    - ceph-network

- name: Ceph storage cluster
  hosts: ed800g9
  serial: 1
  tags: ceph
  roles:
    - pveceph
