- name: Base configuration for all hosts
  hosts: all:!network
  roles:
    - base

- name: Proxmox common configuration
  hosts: proxmox
  roles:
    - proxmox-common

- name: EliteDesk 800 G9 hardware configuration
  hosts: ed800g9
  roles:
    - ed800g9

- name: Observability agents
  hosts: proxmox
  tags: observability
  roles:
    - alloy

- name: Proxmox cluster setup
  hosts: proxmox
  serial: 1
  tags: cluster
  roles:
    - proxmox-cluster

- name: CRS305 10Gb switch configuration
  hosts: network
  tags: network
  roles:
    - routeros-crs305

- name: Ceph network configuration
  hosts: proxmox
  tags: network
  roles:
    - ceph-network

- name: Ceph storage cluster
  hosts: ed800g9
  serial: 1
  tags: ceph
  roles:
    - pveceph

# GitHub Actions runner VMs for officina-site CI. Opt-in only: the `never` tag
# keeps this play out of default runs, so it fires solely with `--tags runners`
# and the officina tailscale auth key passed via --extra-vars. Runs on the
# cluster/template-owner node (pve05); clones are placed per runner_vms.node.
- name: GitHub Actions runner VMs (officina CI)
  hosts: pve05.home.arpa
  tags:
    - never
    - runners
  roles:
    - github-runner-vm
